[package]
name = "release-note"
description = "Generate a release note for your project"
version = "0.11.0"
edition = "2024"
license = "MIT"

[profile.release]
strip = "debuginfo"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.49", features = ["derive", "env"] }
env_logger = "0.11"
git2 = { version = "0.21.0", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
log = "0.4"
minijinja = "2.24"
once_cell = "1.20"
regex = "1.11.1"
ureq = { version = "3.3.0", features = ["json"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
textwrap = { version = "0.16", features = ["smawk"] }
thiserror = "2.0"
urlencoding = "2.1"

[dev-dependencies]
insta = "1.43"
proptest = "1"
tempfile = "3.14"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
